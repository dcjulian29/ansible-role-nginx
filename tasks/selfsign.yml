---
- name: Check if private key file exist
  ansible.builtin.stat:
    path: "{{ item.ssl_cert }}"
  register: nginx_key_exist

- name: Generate an private key file
  community.crypto.openssl_privatekey:
    curve: secp384r1
    group: root
    mode: "0640"
    owner: root
    path: "{{ item.ssl_key }}"
    type: ECC
  when:
    - not nginx_key_exist.stat.exists

- name: Check if certificate file exist
  ansible.builtin.stat:
    path: "{{ item.ssl_cert }}"
  register: nginx_cert_exist

- name: Create certificate file
  community.crypto.x509_certificate:
    group: root
    mode: "0644"
    owner: root
    path: "{{ item.ssl_cert }}"
    privatekey_path: "{{ item.ssl_key }}"
    provider: selfsigned
  when:
    - not nginx_cert_exist.stat.exists
