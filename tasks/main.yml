---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
      paths:
        - vars

- name: Ensure nginx is installed
  ansible.builtin.package:
    name: "{{ nginx_package_name }}"
    update_cache: true
    state: latest

- name: Ensure ssl-cert package is installed
  ansible.builtin.package:
    name: ssl-cert
    state: present
  when: nginx_ssl_enabled

- name: Ensure dhparams is configured properly if needed
  community.crypto.openssl_dhparam:
    path: '/etc/nginx/dhparams.pem'
    select_crypto_backend: openssl
    size: "{{ nginx_ssl_dhparams_size }}"
    mode: '0644'
    owner: 'root'
    group: 'root'
  when: nginx_ssl_enabled

- name: Ensure primary nginx configuration exist
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "/etc/nginx/nginx.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Ensure default nginx vhost file is removed
  ansible.builtin.file:
    path: "{{ nginx_vhost_default }}"
    state: absent
  when: nginx_remove_default_vhost | bool
  notify: Restart nginx

- name: Ensure directory for nginx vhost exists
  ansible.builtin.file:
    path: "{{ nginx_vhost_path }}"
    state: directory
    mode: '0755'

- name: Create self-signed certificates
  ansible.builtin.include_tasks: selfsign.yml
  loop: "{{ nginx_vhosts }}"
  when:
    - nginx_vhosts | length > 0
    - nginx_ssl_enabled
    - item.ssl_cert is defined and item.ssl_cert | length > 0 | default(false)
    - item.ssl_key is defined and item.ssl_key | length > 0 | default(false)

- name: Create virtual host configuration file
  ansible.builtin.include_tasks: vhost.yml
  loop: "{{ nginx_vhosts }}"
  when: nginx_vhosts | length > 0

- name: Ensure nginx is enabled
  ansible.builtin.service:
    name: nginx
    enabled: "{{ nginx_service_enabled }}"

- name: Ensure all handlers run before continuing
  ansible.builtin.meta: flush_handlers

- name: Start nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
  when:
    - nginx_service_state == "started"
    - primary_config.changed or vhost_config_default.changed or vhost_config_add.changed or vhost_config_remove.changed
